# Prefer the TV's HDMI audio over the Pi's headphone jack (both default to 1000).
# Linked into ~/.config/wireplumber/wireplumber.conf.d/ by deploy/kiosk.sh.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]
