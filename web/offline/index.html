<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No internet</title>
  <link rel="stylesheet" href="/offline/offline.css">
</head>
<body>
  <main>
    <svg class="sign" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2.5 8.8a14.5 14.5 0 0 1 19 0"/>
      <path d="M6 12.6a9.5 9.5 0 0 1 12 0"/>
      <path d="M9.4 16.3a4.5 4.5 0 0 1 5.2 0"/>
      <circle cx="12" cy="19.8" r=".6"/>
      <path class="slash" d="M4 3.5l16 17"/>
    </svg>
    <h1>Can't connect to the internet</h1>
    <p>Check the box's Wi-Fi or Ethernet connection.</p>
    <ul class="links">
      <li id="wifi" class="link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5a14 14 0 0 1 18 0"/><path d="M6.5 13.2a9 9 0 0 1 11 0"/><path d="M10 16.8a4 4 0 0 1 4 0"/><circle cx="12" cy="20" r=".6"/></svg>
        <div><strong>Wi-Fi</strong><span id="wifi-state">Checking…</span></div>
      </li>
      <li id="ethernet" class="link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M8.5 9V6h7v3M8 20v-3.5M12 20v-3.5M16 20v-3.5"/></svg>
        <div><strong>Ethernet</strong><span id="ethernet-state">Checking…</span></div>
      </li>
    </ul>
    <small>This screen goes away by itself once the box is back online.</small>
  </main>
  <script src="/offline/offline.js"></script>
</body>
</html>
